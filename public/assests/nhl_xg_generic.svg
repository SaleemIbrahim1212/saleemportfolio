<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061427"/>
      <stop offset="100%" stop-color="#0B2440"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D7ECFF"/>
      <stop offset="100%" stop-color="#9FC7FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <g opacity="0.8" fill="#FFFFFF">
    <circle cx="90" cy="90" r="2"/>
    <circle cx="220" cy="140" r="1.5"/>
    <circle cx="340" cy="70" r="2"/>
    <circle cx="480" cy="120" r="1.5"/>
    <circle cx="650" cy="80" r="2"/>
    <circle cx="760" cy="130" r="1.5"/>
    <circle cx="920" cy="90" r="2"/>
    <circle cx="1050" cy="150" r="1.5"/>
    <circle cx="180" cy="240" r="1.5"/>
    <circle cx="520" cy="220" r="2"/>
    <circle cx="840" cy="240" r="1.5"/>
    <circle cx="1080" cy="260" r="2"/>
  </g>

  <g transform="translate(130 240)">
