  </g>

  <g fill="#E6F2FF">
    <text x="70" y="110" font-family="Georgia, serif" font-size="40" opacity="0.9">Hockey</text>
    <text x="70" y="170" font-family="Georgia, serif" font-size="64" font-weight="700">XG Predictor</text>
